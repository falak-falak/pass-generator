<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator | JavaScript Project</title>
    <!-- LINKING STYLE SHEET -->
    <link rel="stylesheet" href="styles.css" />
    <!-- GOOGLE ICONS -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=content_copy"/>
  </head>
  <body>
    <div class="main flex-col-cen">
      <div class="pass-gen flex-col-cen">
        <h1>Password Generator</h1>
        <!-- Input -->
        <div class="passDisplay-con">
          <input type="text" id="passDisplay" disabled />
          <span class="material-symbols-outlined">
            content_copy
            </span>
        </div>
        <!-- SLIDER -->
        <input type="range" value="8" min="1" max="30" id="slider" />
        <div class="pass-length">
          <p>Password Length</p>
          <span></span>
        </div>

        <!-- CONDIIONS -->
        <div class="condition-row">
          <label for="lowercase">Include Lowercase Letters (a-z)</label>
          <input type="checkbox" id="lowercase" name="lowercase" />
        </div>
        <div class="condition-row">
          <label for="uppercase">Include Uppercase Letters (A-Z)</label>
          <input type="checkbox" id="uppercase" name="uppercase" />
        </div>
        <div class="condition-row">
          <label for="number">Include Numbers (0-9)</label>
          <input type="checkbox" id="number" name="number" />
        </div>
        <div class="condition-row">
          <label for="symbols">Include Symbols (@-*)</label>
          <input type="checkbox" id="symbols" name="symbols" />
        </div>

        <!-- PASS BUTTON -->
        <button class="genPassBtn">Generate Password</button>
      </div>
        <p class="developer-msg">Developed with ❤️ by Falak</p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
